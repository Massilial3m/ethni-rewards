# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9c60ffc265596952c17499650b6cafae"
application_url = "https://ethni-rewards.onrender.com"
embedded = true
name = "ethni-rewards"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Protected Customer Data access validé le 2026-07-30 (boutique de dev) :
  # les 3 webhooks liés aux données client peuvent être réactivés.

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/create"
  topics = [ "customers/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  # Webhooks obligatoires de conformité RGPD (tout app touchant des données client).
  # Ces 3 topics utilisent `compliance_topics`, pas `topics`.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,write_discounts"

[app_proxy]
url = "https://ethni-rewards.onrender.com/proxy"
prefix = "apps"
subpath = "loyalty"

[auth]
redirect_urls = [ "https://ethni-rewards.onrender.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
